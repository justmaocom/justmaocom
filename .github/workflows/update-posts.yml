name: Update recent posts

on:
  schedule:
    - cron: "30 10 * * *" # daily at 18:30 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/test_update_posts.py
      - run: python3 scripts/update_posts.py
      - name: Commit if the list changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update recent posts" README.md
          git push
