<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t">
  <title id="t">JustMao. Start with a question, write down the answer: question, sources, version checked, answer.</title>
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <clipPath id="frame"><rect width="1200" height="340" rx="24"/></clipPath>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#1c1b19"/>
    <circle cx="1110" cy="10" r="170" fill="#2a2824"/>
    <circle cx="1108" cy="10" r="106" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.08"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" fill="#f2efe8">
    <text x="48" y="74" font-size="20" font-weight="600" letter-spacing="4">JUSTMAO.COM</text>
    <text x="44" y="152" font-size="72" font-weight="700" letter-spacing="1">JustMao</text>
    <g stroke="#a8a39a" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M48 178v14"/>
      <path d="M48 185H1138" stroke-dasharray="0.1 7"/>
      <path d="M1130 179l9 6-9 6"/>
    </g>
    <circle cx="1152" cy="185" r="4" fill="#a8a39a"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="2.5" text-anchor="middle" dominant-baseline="central">
      <!-- background-colored copy underneath knocks the dotted line out behind each label; paint-order on the label itself breaks per glyph in WebKit -->
      <g fill="#1c1b19" stroke="#1c1b19" stroke-width="16" stroke-linejoin="round">
        <text x="228" y="185">QUESTION</text>
        <text x="448" y="185">SOURCES</text>
        <text x="708" y="185">VERSION CHECKED</text>
        <text x="962" y="185" font-weight="700">ANSWER</text>
      </g>
      <g fill="#a8a39a">
        <text x="228" y="185">QUESTION</text>
        <text x="448" y="185">SOURCES</text>
        <text x="708" y="185">VERSION CHECKED</text>
        <text x="962" y="185" font-weight="700" fill="#f2efe8">ANSWER</text>
      </g>
    </g>
    <text x="48" y="236" font-size="28" fill="#a8a39a">Start with a question, write down the answer<tspan class="cursor" dx="4" font-weight="300">|</tspan></text>
    <text x="48" y="278" font-size="18" letter-spacing="0.5" fill="#a8a39a">Coding agent workflows · Agent security · Source-code deep dives</text>
  </g>
</svg>
